<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayLattice · Player Breakdown</title>
<style>body{margin:0;background:#091218;color:#edf3fa;font:16px system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:18px}h1{font-size:23px;margin:0 0 5px}p{color:#b9c7d4;line-height:1.5}main{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:24px;padding-top:0}video{width:100%;max-height:82vh;border-radius:14px;background:#000}section{background:#14212c;border:1px solid #2b4050;border-radius:14px;padding:22px;align-self:start}button{display:block;width:100%;margin:10px 0;padding:14px;text-align:left;border:1px solid #5b7280;border-radius:9px;background:#203541;color:white;font:inherit;cursor:pointer}button:hover{background:#355869}button:disabled{opacity:.6;cursor:default}.badge{color:#b8f56b;font-weight:700}.answer{font-size:20px;color:#b8f56b}small{color:#a5b6c6}@media(max-width:650px){main{grid-template-columns:1fr}video{max-height:65vh}section{padding:16px}}</style>
<header><h1>PlayLattice · Player Breakdown</h1><small id="summary">Loading preview…</small></header>
<audio id="quizmusic" loop></audio><main><video id="video" controls playsinline></video><section><div class="badge">PREDICT THE NEXT MOMENT</div><h2 id="question">Watch the highlighted players</h2><p id="instructions">Playback pauses at each quiz. Pick an answer, then watch the next action reveal it.</p><div id="choices"></div><p class="answer" id="feedback"></p><button id="restart">Restart Preview</button><small>Player labels are provisional. Questions use tracked screen movement, not verified basketball outcomes.</small></section></main>
<script>
const base=location.pathname.replace(/\/$/,''),video=document.querySelector('#video'),question=document.querySelector('#question'),choices=document.querySelector('#choices'),feedback=document.querySelector('#feedback'),instructions=document.querySelector('#instructions');
const music=document.querySelector('#quizmusic');
function stopMusic(){music.pause();music.currentTime=0;}
let manifest,active=-1,answered=new Set(),choice;
video.src=base+'/video';
fetch(base+'/manifest').then(r=>{if(!r.ok)throw Error('Preview unavailable');return r.json()}).then(m=>{manifest=m;if(m.quiz_music_configured)music.src=base+'/music';document.querySelector('#summary').textContent=`9:16 · ${m.track_count} player-focused replays · ${m.quiz_count} quizzes`+(m.quiz_music_missing?' · Quiz music unavailable':' · Music: '+(m.quiz_music_title||'Quiz cue'));}).catch(e=>instructions.textContent=e.message);
video.addEventListener('timeupdate',()=>{if(!manifest)return;for(let i=0;i<manifest.music_cues.length;i++){const cue=manifest.music_cues[i],quiz=manifest.quizzes.find(q=>q.candidate_id===cue.candidate_id);if(!quiz)continue;if(!answered.has(i)&&video.currentTime>=cue.start_seconds+.08&&video.currentTime<cue.start_seconds+cue.duration_seconds){active=i;video.pause();if(manifest.quiz_music_configured){music.volume=.32;music.currentTime=0;music.play().catch(()=>{});}question.textContent=quiz.question.replace('track','player');feedback.textContent='';choices.replaceChildren();instructions.textContent='Choose an answer. The next second of play will show what happens.';for(const option of quiz.options){const b=document.createElement('button');b.textContent=option.id+'. '+option.text;b.onclick=()=>{choice=option.id;answered.add(i);choices.querySelectorAll('button').forEach(x=>x.disabled=true);instructions.textContent='Your answer is locked. Watch the next moment.';let steps=0;const fade=setInterval(()=>{music.volume=Math.max(0,.32*(1-++steps/10));if(steps>=10){clearInterval(fade);stopMusic();video.currentTime=cue.start_seconds+cue.duration_seconds;video.play();}},25);};choices.append(b);}break;}}
if(active>=0&&answered.has(active)){const cue=manifest.music_cues[active],quiz=manifest.quizzes.find(q=>q.candidate_id===cue.candidate_id);if(video.currentTime>=cue.start_seconds+cue.duration_seconds+(quiz.reveal_ms-quiz.freeze_ms)/1000){const answer=quiz.options.find(o=>o.id===quiz.correct_option_id);feedback.textContent=(choice===answer.id?'Correct! ':'Answer: ')+answer.text;instructions.textContent=quiz.explanation;}}});
document.querySelector('#restart').onclick=()=>{stopMusic();answered.clear();active=-1;choices.replaceChildren();feedback.textContent='';question.textContent='Watch the highlighted players';instructions.textContent='Playback pauses at each quiz. Pick an answer, then watch the next action reveal it.';video.currentTime=0;video.play();};
</script></html>
