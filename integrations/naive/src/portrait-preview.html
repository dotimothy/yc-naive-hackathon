<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayLattice · Player Breakdown</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b37,#070c13 65%);color:#eef3fa;font:16px Arial,system-ui,sans-serif}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:18px;padding-block:28px}.brandmark{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#ff8845;color:#17110d;font-weight:900;font-size:22px}h1{font-size:24px;letter-spacing:-.04em;margin:0 0 7px}h2{font-size:31px;line-height:1.15;letter-spacing:-.03em;margin:16px 0}p{color:#a8bacd;line-height:1.6}main{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:36px;padding-top:4px;align-items:start}video{width:100%;max-height:82vh;border:1px solid #3a4e63;border-radius:22px;background:#000;box-shadow:0 24px 80px #0007}section{position:sticky;top:24px;background:linear-gradient(145deg,#152332,#101a27);border:1px solid #31485e;border-radius:22px;padding:30px;box-shadow:0 16px 50px #0003}.badge{display:inline-flex;align-items:center;gap:8px;background:#39271e;border:1px solid #7d4b2f;border-radius:7px;color:#ffad7c;font-size:12px;font-weight:800;letter-spacing:.09em;padding:8px 11px}.badge:before{content:'●';font-size:8px}#choices{display:grid;gap:11px;margin:24px 0}button{cursor:pointer;font:inherit}.option-card{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;margin:0;padding:12px 15px;text-align:left;border:1px solid #405976;border-radius:13px;background:#1c2d42;color:white;font-size:18px;font-weight:700;transition:border-color .15s,background .15s,transform .15s}.choice-key{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:9px;background:#344b65;color:#dce8f5;font-size:20px}.option-card:hover:not(:disabled){border-color:#ff9758;transform:translateX(3px)}.option-card.selected{border-color:#ff9758;background:#392b25}.selected .choice-key{background:#ff9758;color:#17110d}.option-card.correct{border-color:#b7ef93;background:#1e392e}.correct .choice-key{background:#b7ef93;color:#132217}.option-card.incorrect{border-color:#e68b83;background:#3b282d}.option-card:disabled{cursor:default}.option-card:disabled:not(.selected):not(.correct){opacity:.6}.option-card:focus-visible,#restart:focus-visible{outline:3px solid #ffad7c;outline-offset:3px}.answer{font-size:23px;font-weight:800;color:#bded9e;min-height:30px;line-height:1.3}small{color:#91a8bd;font-size:12px;line-height:1.6}#restart{margin:6px 0 20px;border:1px solid #405570;border-radius:9px;background:transparent;color:#c2d2e3;padding:10px 15px;font-size:13px}.note{display:block;border-top:1px solid #2b3e52;padding-top:17px}#summary{color:#b1c1d3}@media(max-width:700px){header,main{padding:18px}main{grid-template-columns:1fr;gap:22px}video{width:min(100%,290px);max-height:57vh;justify-self:center;border-radius:15px}section{position:static;padding:22px}h2{font-size:25px}.option-card{min-height:64px;font-size:17px}.brandmark{width:40px;height:40px;font-size:19px}h1{font-size:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><span class="brandmark" aria-hidden="true">PL</span><div><h1>PlayLattice · Read The Game</h1><small id="summary">Loading preview…</small></div></header>
<audio id="quizmusic" loop></audio><main><video id="video" controls playsinline></video><section><div class="badge">PREDICT THE NEXT MOMENT</div><h2 id="question">Watch the highlighted players</h2><p id="instructions">Playback pauses at each quiz. Pick an answer, then watch the next action reveal it.</p><div id="choices" role="group" aria-label="Prediction answers"></div><p class="answer" id="feedback" aria-live="polite"></p><button id="restart">Restart Preview</button><small class="note">Player labels are provisional. Questions use tracked screen movement, not verified basketball outcomes.</small></section></main>
<script>
const base=location.pathname.replace(/\/$/,''),video=document.querySelector('#video'),question=document.querySelector('#question'),choices=document.querySelector('#choices'),feedback=document.querySelector('#feedback'),instructions=document.querySelector('#instructions');
const music=document.querySelector('#quizmusic');
function stopMusic(){music.pause();music.currentTime=0;}
let manifest,active=-1,answered=new Set(),choice;
const isStory=()=>manifest?.profile==='player-portrait-story-v1';
function showStory(){let cursor=0;for(const story of manifest.stories||[]){const duration=(story.source_end_ms-story.source_start_ms)/1000;if(video.currentTime<cursor+duration){const sourceMs=story.source_start_ms+(video.currentTime-cursor)*1000;const beat=story.beats.find(b=>sourceMs>=b.start_ms&&sourceMs<b.end_ms)||story.beats.at(-1);document.querySelector('.badge').textContent=beat.title;question.textContent=beat.headline;instructions.textContent=beat.caption;return;}cursor+=duration;}}
video.src=base+'/video';
fetch(base+'/manifest').then(r=>{if(!r.ok)throw Error('Preview unavailable');return r.json()}).then(m=>{manifest=m;if(isStory()){document.querySelector('#summary').textContent=`9:16 · ${m.track_count} captioned player stories`;document.querySelector('.note').textContent='Provisional player labels. Stories describe measured image motion, not verified basketball outcomes.';choices.hidden=true;feedback.hidden=true;showStory();}if(m.cover)video.poster=base+'/cover';if(m.quiz_music_configured)music.src=base+'/music';if(!isStory())document.querySelector('#summary').textContent=`9:16 · ${m.track_count} player-focused replays · ${m.quiz_count} quizzes`+(m.quiz_music_missing?' · Quiz music unavailable':' · Music: '+(m.quiz_music_title||'Quiz cue'));}).catch(e=>instructions.textContent=e.message);
video.addEventListener('timeupdate',()=>{if(!manifest)return;if(isStory()){showStory();return;}for(let i=0;i<manifest.music_cues.length;i++){const cue=manifest.music_cues[i],quiz=manifest.quizzes.find(q=>q.candidate_id===cue.candidate_id);if(!quiz)continue;if(!answered.has(i)&&video.currentTime>=cue.start_seconds+.08&&video.currentTime<cue.start_seconds+cue.duration_seconds){active=i;video.pause();if(manifest.quiz_music_configured){music.volume=.32;music.currentTime=0;music.play().catch(()=>{});}question.textContent=quiz.question.replace('track','player');feedback.textContent='';choices.replaceChildren();instructions.textContent='Choose an answer. The next second of play will show what happens.';for(const option of quiz.options){const b=document.createElement('button');b.className='option-card';b.dataset.option=option.id;const key=document.createElement('span'),label=document.createElement('span');key.className='choice-key';key.setAttribute('aria-hidden','true');b.setAttribute('aria-label',option.id+'. '+option.text);key.textContent=option.id;label.textContent=option.text;b.append(key,label);b.onclick=()=>{b.classList.add('selected');b.setAttribute('aria-pressed','true');choice=option.id;answered.add(i);choices.querySelectorAll('button').forEach(x=>x.disabled=true);instructions.textContent='Your answer is locked. Watch the next moment.';let steps=0;const fade=setInterval(()=>{music.volume=Math.max(0,.32*(1-++steps/10));if(steps>=10){clearInterval(fade);stopMusic();video.currentTime=cue.start_seconds+cue.duration_seconds;video.play();}},25);};choices.append(b);}break;}}
if(active>=0&&answered.has(active)){const cue=manifest.music_cues[active],quiz=manifest.quizzes.find(q=>q.candidate_id===cue.candidate_id);if(video.currentTime>=cue.start_seconds+cue.duration_seconds+(quiz.reveal_ms-quiz.freeze_ms)/1000){const answer=quiz.options.find(o=>o.id===quiz.correct_option_id);choices.querySelectorAll('button').forEach(b=>{b.classList.toggle('correct',b.dataset.option===answer.id);b.classList.toggle('incorrect',b.dataset.option===choice&&choice!==answer.id);});feedback.textContent=(choice===answer.id?'Correct! ':'Answer: ')+answer.text;instructions.textContent=quiz.explanation;}}});
document.querySelector('#restart').onclick=()=>{stopMusic();answered.clear();active=-1;choices.replaceChildren();feedback.textContent='';question.textContent='Watch the highlighted players';instructions.textContent='Playback pauses at each quiz. Pick an answer, then watch the next action reveal it.';video.currentTime=0;if(isStory())showStory();video.play();};
</script></html>
